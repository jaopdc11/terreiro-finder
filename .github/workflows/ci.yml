name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Integração e e2e sobem Postgres 17 (docker do runner) + encruza-api.
# A API é repo privado: precisa do secret ENCRUZA_API_TOKEN (PAT só-leitura).
env:
  ENCRUZA_API_DIR: ${{ github.workspace }}/encruza-api

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # pnpm/action-setup@v4 roda em Node default do runner (20) e quebra
      # com pnpm@11.1.2 (que exige >=22.13). Usamos corepack — vem com Node
      # e respeita o "packageManager" do package.json.
      - run: corepack enable && corepack prepare pnpm@11.1.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  vitest:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.1.2 --activate
      - run: pnpm install --frozen-lockfile

      - name: Vitest unit (jsdom)
        run: pnpm test:unit

      - name: Checkout da encruza-api
        uses: actions/checkout@v4
        with:
          repository: jaopdc11/encruza-api
          token: ${{ secrets.ENCRUZA_API_TOKEN }}
          path: encruza-api
      - name: Build da encruza-api
        working-directory: encruza-api
        run: npm ci && npm run build
      - name: Vitest integration (autorização contra a API real)
        run: pnpm test:integration

  playwright:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.1.2 --activate
      - run: pnpm install --frozen-lockfile

      - name: Instala Chromium do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Checkout da encruza-api
        uses: actions/checkout@v4
        with:
          repository: jaopdc11/encruza-api
          token: ${{ secrets.ENCRUZA_API_TOKEN }}
          path: encruza-api
      - name: Build da encruza-api
        working-directory: encruza-api
        run: npm ci && npm run build

      - name: E2E (Playwright desktop + mobile)
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    strategy:
      fail-fast: false
      matrix:
        preset: [mobile, desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.1.2 --activate
      - run: pnpm install --frozen-lockfile

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Build app
        run: pnpm build

      - name: Lighthouse (${{ matrix.preset }})
        run: pnpm lhci
        env:
          LIGHTHOUSE_PRESET: ${{ matrix.preset }}
