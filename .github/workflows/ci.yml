jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  vitest:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Vitest unit (jsdom)
        run: pnpm test:unit

      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Sobe Supabase local
        run: supabase start --workdir .
      - name: Vitest integration (RLS contra Postgres real)
        run: pnpm test:integration

  playwright:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Instala Chromium do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Sobe Supabase local
        run: supabase start --workdir .

      - name: Build app
        run: pnpm build
      - name: E2E (Playwright desktop + mobile)
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # lighthouse-ci: gate em PRs depois de termos mais conteúdo na home (Fase 5).
