name: Deploy GitHub Pages

# Deploy manual (workflow_dispatch) até a encruza-api estar no ar na VPS.
# A URL da API entra no build (VITE_API_URL); não é segredo.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.1.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_API_URL: https://encruza.api.jaopd.dev
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
