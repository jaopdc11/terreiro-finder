<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Encruza</title>
    <script>
      // Truque GitHub Pages SPA: redireciona 404 pra index.html preservando rota.
      // Inspirado em github.com/rafgraph/spa-github-pages
      (function () {
        var l = window.location;
        var segmentCount = 0; // 0 quando o site mora na raiz do domínio
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname
              .split('/')
              .slice(0, 1 + segmentCount)
              .join('/') +
            '/?/' +
            l.pathname
              .slice(1)
              .split('/')
              .slice(segmentCount)
              .join('/')
              .replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
